<div class="card">
  <h4 class="card-header">Register</h4>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-2 mb-3">
          <label class="form-label">Title</label>
          <select formControlName="title" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['title'].errors }">
            <option value=""></option>
            <option value="Mr">Mr</option>
            <option value="Mrs">Mrs</option>
            <option value="Miss">Miss</option>
            <option value="Ms">Ms</option>
          </select>
          <div class="invalid-feedback">Title is required.</div>
        </div>
        <div class="col-md-5 mb-3">
          <label class="form-label">First Name</label>
          <input type="text" formControlName="firstName" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['firstName'].errors }" />
          <div class="invalid-feedback">First Name is required.</div>
        </div>
        <div class="col-md-5 mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" formControlName="lastName" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['lastName'].errors }" />
          <div class="invalid-feedback">Last Name is required.</div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Password</label>
          <input type="password" formControlName="password" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" formControlName="confirmPassword" class="form-control"
            [ngClass]="{ 'is-invalid': (submitted && f['confirmPassword'].errors) || (submitted && form.errors?.['mustMatch']) }" />
          <div class="invalid-feedback">Passwords must match.</div>
        </div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" formControlName="acceptTerms" id="acceptTerms" class="form-check-input"
          [ngClass]="{ 'is-invalid': submitted && f['acceptTerms'].errors }" />
        <label for="acceptTerms" class="form-check-label">
          Accept Terms & Conditions
        </label>
        <div class="invalid-feedback">Accept Terms & Conditions is required.</div>
      </div>
      <button [disabled]="loading" class="btn btn-primary">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
        Register
      </button>
      <a routerLink="/account/login" class="btn btn-link">Login</a>
    </form>
  </div>
</div>
